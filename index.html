const GUIDE=`Bienvenido a Hojas, un lector pensado para leer despacio, con la sensación de tener entre las manos un libro antiguo. Cada página contiene quinientas palabras exactas, ni una más, de modo que el texto avanza en tramos pequeños y fáciles de recordar. Cuando llegues al final de una página, desliza el dedo hacia la izquierda y la hoja se pasará; si prefieres volver atrás, desliza hacia la derecha. También puedes usar las flechas que aparecen abajo, el control deslizante para saltar a cualquier página o las teclas de dirección si lees en un ordenador.
Dentro de cada página puedes desplazarte hacia abajo con normalidad. La aplicación recuerda tanto la página como el punto exacto en el que te quedaste, de modo que al volver a abrir un texto continuarás justo donde lo dejaste.
Para subrayar, toca una palabra y después toca otra para ampliar la selección. Si lo prefieres, usa los botones Frase o Párrafo y la selección se extenderá sola. Con el texto seleccionado puedes elegir uno de cuatro colores para subrayarlo, guardarlo en tu colección de frases o escribir una nota que quedará unida a ese fragmento. Todo lo que subrayes y guardes se reúne después en las pestañas Frases y Notas, desde donde puedes copiar cualquier fragmento o saltar directamente a la página en la que lo encontraste.
Si prefieres escuchar, pulsa el botón Escuchar. La voz leerá la página completa, marcará la palabra que va diciendo y pasará a la siguiente cuando termine. Puedes pausarla en cualquier momento y cambiar la velocidad o la voz desde el panel de apariencia, que encontrarás pulsando las letras Aa en la parte superior del lector.
En ese mismo panel puedes elegir entre varios tipos de papel, desde el pergamino envejecido hasta un fondo oscuro para leer de noche. También puedes crear tu propia paleta y ajustar cada color: el fondo, el papel, la tinta y el acento, tanto para el modo claro como para el oscuro. El tamaño de la letra, el tipo de imprenta y el número de columnas son igualmente ajustables.
Para añadir tus propios artículos o libros, ve a la biblioteca y pulsa Añadir. Puedes pegar el texto directamente o cargar un archivo de texto. La aplicación lo dividirá en páginas de quinientas palabras y preparará un resumen compacto con lo más importante, que podrás corregir cuando quieras. Si tienes un resumen mejor, por ejemplo uno que te haya preparado Claude, pégalo en el campo correspondiente y sustituirá al automático.
Una recomendación más: no te obligues a terminar un texto de una sentada. Lo importante es la regularidad. Lee una o dos páginas cada día, subraya lo que de verdad te llame la atención y vuelve a tus frases guardadas cuando necesites recordar lo aprendido. Con el tiempo, tu colección de frases y notas será un cuaderno de ideas propio, hecho de todo lo que has leído y de lo que decidiste conservar.
Por último, la constancia es lo que convierte la lectura en hábito. Hojas cuenta los días seguidos que has leído y te avisará si hoy todavía no lo has hecho. Basta con pasar unas pocas páginas para mantener la racha. Feliz lectura.`;

 const imp=h('input',{type:'file',accept:'.json,application/json',hidden:true,id:'bk-file',onchange:()=>{const f=imp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(String(r.result));const s=o.state||o;if(!Array.isArray(s.articles))throw 0;pend=s;info.replaceChildren('Copia con '+s.articles.length+' artículos. ',h('button',{class:'btn sm danger',onclick:()=>{S=norm(pend);cache.clear();persist();applyTheme();toast('Copia restaurada');go('lib')}},'Reemplazar mis datos'))}catch(e){info.textContent='Ese archivo no es una copia de Hojas.'}};r.readAsText(f)}});
 box.append(h('div',{class:'line-in'},h('button',{class:'btn',onclick:()=>imp.click()},'Importar copia'),imp),info);return box}

/* ===== recordatorio con la app abierta ===== */
function checkRemind(){const r=S.settings.remind;if(!r.on||readToday())return;const d=new Date(),k=dkey(d);if(S.remindedOn===k)return;const [hh,mm]=(r.time||'20:00').split(':').map(Number);if(d.getHours()*60+d.getMinutes()<hh*60+mm)return;
 S.remindedOn=k;save();toast('Hora de leer: unas páginas bastan');
 try{if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(reg=>reg.showNotification('Hojas',{body:'Todavía no has leído hoy. Unas páginas bastan.',icon:'icon-192.png'})).catch(()=>{})}catch(e){}
 if(view==='lib')render()}
setInterval(checkRemind,30000);

/* ===== arranque ===== */
applyTheme();render();setTimeout(checkRemind,1500);
try{navigator.storage?.persist?.()}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script>
